version: '3.8'

services:
  invoice-merger:
    build: .
    ports:
      - "3000:3000"
    environment:
      - WORKERS=4
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3000', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s